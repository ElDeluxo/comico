name: Build iOS IPA and DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA and DEB
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dpkg
        run: brew install dpkg

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Archive
        run: |
          mkdir -p build
          xcodebuild -project Comico/Comico.xcodeproj \
                     -scheme Comico \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/Comico.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/ipa-prep/Payload
          cp -r build/Comico.xcarchive/Products/Applications/Comico.app build/ipa-prep/Payload/
          cd build/ipa-prep
          zip -r ../Comico.ipa Payload
          cd ../..
          ls -lh build/Comico.ipa

      - name: Package DEB
        run: |
          mkdir -p deb-prep/Applications
          cp -r build/Comico.xcarchive/Products/Applications/Comico.app deb-prep/Applications/
          mkdir -p deb-prep/DEBIAN
          cp packaging/control deb-prep/DEBIAN/control
          cp packaging/postinst deb-prep/DEBIAN/postinst
          chmod 755 deb-prep/DEBIAN/postinst
          dpkg-deb --build --root-owner-group deb-prep build/Comico.deb
          ls -lh build/Comico.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comico-iOS-Packages
          path: |
            build/Comico.ipa
            build/Comico.deb
          retention-days: 30
