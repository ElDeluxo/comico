name: Build Comico Universal & Swift (iOS 9.0)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-universal:
    name: Build Universal IPA & DEB (armv7 + arm64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y fakeroot libtinfo5 libtinfo6 zlib1g-dev xz-utils zip unzip || true

      - name: Setup Theos & iOS Cross Toolchain
        run: |
          echo "Cloning Theos..."
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          echo "Installing iOS Cross Toolchain (Supports armv7 & arm64)..."
          mkdir -p ~/theos/toolchain
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C ~/theos/toolchain/
          
          echo "Installing iOS SDKs (including iPhoneOS11.4.sdk)..."
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          
          echo "Installing ldid..."
          curl -sLo ~/theos/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          chmod +x ~/theos/bin/ldid
          
          echo "Setting environment variables..."
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
          echo "Verifying clang..."
          ~/theos/toolchain/linux/iphone/bin/clang --version

      - name: Setup mbedTLS 3.6 (TLS 1.3 Engine)
        run: |
          if [ ! -d "vendor/mbedtls/library" ]; then
            echo "Cloning mbedTLS v3.6.0..."
            git clone --depth 1 --branch v3.6.0 https://github.com/Mbed-TLS/mbedtls.git vendor/mbedtls
          fi
          echo "mbedTLS source ready:"
          ls -d vendor/mbedtls/include vendor/mbedtls/library

      - name: Build Comico (armv7 + arm64)
        run: |
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm || true
          set -o pipefail
          if make package FINALPACKAGE=1 2>&1 | tee build.log; then
            echo "Build successful!"
          else
            echo "Build failed. Pushing log..."
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git checkout -B build-logs
            git add -f build.log
            git commit -m "theos build log"
            git push origin build-logs --force || true
            exit 1
          fi

      - name: Verify Mach-O Architectures & Bundle
        run: |
          APP_PATH=".theos/_/Applications/Comico.app"
          echo "Inspecting binary at: $APP_PATH/Comico"
          file "$APP_PATH/Comico"
          
          if [ -x ~/theos/toolchain/linux/iphone/bin/arm64-apple-darwin-lipo ]; then
            ~/theos/toolchain/linux/iphone/bin/arm64-apple-darwin-lipo -info "$APP_PATH/Comico" || true
          fi

      - name: Package IPA
        run: |
          APP_PATH=".theos/_/Applications/Comico.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Staged app not at expected path, searching..."
            APP_PATH=$(find .theos -path "*/Applications/Comico.app" -type d | head -n 1)
          fi
          echo "Using final app bundle at: $APP_PATH"
          
          # Ensure Info.plist is present
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Copying Info.plist into app bundle..."
            cp Info.plist "$APP_PATH/Info.plist"
          fi
          
          # Ensure icons and resources are present
          cp -r Resources/* "$APP_PATH/" || true
          
          echo "App bundle contents:"
          ls -la "$APP_PATH"
          
          # Create IPA Payload
          mkdir -p ipa-build/Payload
          cp -r "$APP_PATH" ipa-build/Payload/
          cd ipa-build
          zip -r ../Comico_Universal_iOS9.ipa Payload
          cd ..
          
          echo "Verifying IPA contents for Sideloadly:"
          unzip -l Comico_Universal_iOS9.ipa | grep "Payload/Comico.app/Info.plist"
          unzip -l Comico_Universal_iOS9.ipa | grep "Payload/Comico.app/cacert.pem"
          ls -lh Comico_Universal_iOS9.ipa

      - name: Package DEB
        run: |
          APP_PATH=".theos/_/Applications/Comico.app"
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            cp Info.plist "$APP_PATH/Info.plist"
          fi
          cp -r Resources/* "$APP_PATH/" || true
          
          dpkg-deb --build --root-owner-group .theos/_ Comico_Universal_iOS9.deb
          ls -lh Comico_Universal_iOS9.deb

      - name: Package Mangie for iPad
        run: |
          python3 package_mangie.py
          ls -lh Mangie_iPad_iOS9.*

      - name: Upload Universal Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comico-iOS9-Universal
          path: |
            Comico_Universal_iOS9.ipa
            Comico_Universal_iOS9.deb
            Mangie_iPad_iOS9.ipa
            Mangie_iPad_iOS9.deb
          retention-days: 30

  build-swift:
    name: Build Swift IPA & DEB (Xcode)
    runs-on: macos-14
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dpkg
        run: brew install dpkg || true

      - name: Setup Xcode
        run: |
          echo "Active Xcode:"
          xcodebuild -version

      - name: Build Comico.app
        run: |
          mkdir -p build
          set -o pipefail
          if xcodebuild -project Comico/Comico.xcodeproj \
                     -scheme Comico \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build/DerivedData \
                     build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log; then
            echo "Swift build succeeded!"
          else
            echo "Swift build failed. Printing log..."
            tail -n 100 build.log
            exit 1
          fi

      - name: Set iOS 9 Compatibility in Info.plist & Binary
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"

          # Force MinimumOSVersion to 9.0 in Info.plist
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 9.0" "$APP_PATH/Info.plist" || \
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 9.0" "$APP_PATH/Info.plist"

          echo "Verified Info.plist MinimumOSVersion:"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist"

      - name: Package Swift IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          echo "Packaging Swift app at: $APP_PATH"
          mkdir -p ipa-swift/Payload
          cp -r "$APP_PATH" ipa-swift/Payload/
          cd ipa-swift
          zip -r ../Comico_Swift.ipa Payload
          cd ..
          ls -lh Comico_Swift.ipa

      - name: Package Swift DEB
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          mkdir -p deb-swift/Applications
          cp -r "$APP_PATH" deb-swift/Applications/
          mkdir -p deb-swift/DEBIAN
          cp packaging/control deb-swift/DEBIAN/control
          cp packaging/postinst deb-swift/DEBIAN/postinst
          chmod 755 deb-swift/DEBIAN/postinst
          dpkg-deb --build --root-owner-group deb-swift Comico_Swift.deb
          ls -lh Comico_Swift.deb

      - name: Upload Swift Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comico-Swift-Packages
          path: |
            Comico_Swift.ipa
            Comico_Swift.deb
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build-universal, build-swift]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    steps:
      - name: Download Universal Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Comico-iOS9-Universal
          path: release-files
        continue-on-error: true

      - name: Download Swift Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Comico-Swift-Packages
          path: release-files
        continue-on-error: true

      - name: Inspect Release Files
        run: |
          ls -la release-files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.8' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Comico & Mangie {0}', github.ref_name) || 'Comico & Mangie v1.3.8 (iOS 9.0+ Universal & Anti-Crash)' }}
          files: release-files/*
          body: |
            ### Comico v1.3.8 & Mangie iPad Edition para iOS 9

            #### 🛠️ Solución Definitiva de Rendimiento y Memoria (v1.3.8):
            - **Sub-muestreo inteligente de imágenes con ImageIO:** Se reemplazó la decodificación completa `UIImage imageWithData:` por `CGImageSourceCreateThumbnailAtIndex` con límite a resolución de pantalla (máx 1280px para páginas y 320px para portadas). Esto reduce el consumo de memoria RAM de 24-48 MB por imagen a solo 2-3 MB, evitando que el kernel de iOS mate la app por OOM (Jetsam).
            - **Eliminación del bucle de layout en detalle:** Se eliminó la reasignación de `tableHeaderView` en `viewDidLayoutSubviews` de `ComicDetailViewController`, previniendo ciclos infinitos de diseño en iOS 9.
            - **Carga de páginas de Cómics Occidentales (Internet Archive):** Se restauró el soporte para URLs de descarga de cómics occidentales en `APIService.m`.
            - **Capturador de señales UNIX (SIGSEGV, SIGBUS, SIGABRT):** Registro completo en disco de cualquier caída nativa en `Documents/crash_log.txt` visible en la pestaña Diagnóstico.
            - **Gestión de memoria agresiva en lector:** Purgado automático de caché de páginas y respuesta inmediata a advertencias de memoria del sistema (`didReceiveMemoryWarning`).
