name: Build iOS IPA and DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA and DEB
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dpkg
        run: brew install dpkg

      - name: Environment Info
        run: |
          xcodebuild -version
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true

      - name: Build Comico.app
        run: |
          mkdir -p build
          xcodebuild -project Comico/Comico.xcodeproj \
                     -scheme Comico \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build/DerivedData \
                     build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES > build.log 2>&1

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Build-Log
          path: build.log

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ipa-prep/Payload
          cp -r "$APP_PATH" build/ipa-prep/Payload/
          cd build/ipa-prep
          zip -r ../Comico.ipa Payload
          cd ../..
          ls -lh build/Comico.ipa

      - name: Package DEB
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          mkdir -p deb-prep/Applications
          cp -r "$APP_PATH" deb-prep/Applications/
          mkdir -p deb-prep/DEBIAN
          cp packaging/control deb-prep/DEBIAN/control
          cp packaging/postinst deb-prep/DEBIAN/postinst
          chmod 755 deb-prep/DEBIAN/postinst
          dpkg-deb --build --root-owner-group deb-prep build/Comico.deb
          ls -lh build/Comico.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comico-iOS-Packages
          path: |
            build/Comico.ipa
            build/Comico.deb
          retention-days: 30
