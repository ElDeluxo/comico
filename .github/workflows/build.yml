name: Build iOS IPA and DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA and DEB (Target: iOS 9.0)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dpkg
        run: brew install dpkg

      - name: Environment Info
        run: |
          xcodebuild -version
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true

      - name: Build Comico.app
        run: |
          mkdir -p build
          set -o pipefail

          echo "Attempting build targeting iOS 9.0..."
          if ! xcodebuild -project Comico/Comico.xcodeproj \
                          -scheme Comico \
                          -configuration Release \
                          -destination 'generic/platform=iOS' \
                          -derivedDataPath build/DerivedData \
                          build \
                          IPHONEOS_DEPLOYMENT_TARGET=9.0 \
                          CODE_SIGNING_ALLOWED=NO \
                          CODE_SIGNING_REQUIRED=NO \
                          CODE_SIGN_IDENTITY="" \
                          AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log; then
            echo "Xcode requires >=12.0 SDK for compilation. Compiling with base SDK, then applying iOS 9 patch..."
            xcodebuild -project Comico/Comico.xcodeproj \
                       -scheme Comico \
                       -configuration Release \
                       -destination 'generic/platform=iOS' \
                       -derivedDataPath build/DerivedData \
                       build \
                       IPHONEOS_DEPLOYMENT_TARGET=12.0 \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       AD_HOC_CODE_SIGNING_ALLOWED=YES
          fi

      - name: Patch Binary and Info.plist for iOS 9.0
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"

          # 1. Force Info.plist to require iOS 9.0
          echo "Patching Info.plist MinimumOSVersion to 9.0..."
          plutil -replace MinimumOSVersion -string "9.0" "$APP_PATH/Info.plist"
          plutil -p "$APP_PATH/Info.plist" | grep -i MinimumOSVersion || true

          # 2. Patch Mach-O load command to 9.0 using vtool
          if which vtool >/dev/null 2>&1; then
            echo "Original Mach-O build info:"
            vtool -show-build "$APP_PATH/Comico" || true

            echo "Setting version to 9.0..."
            (vtool -replace -set-build-version ios 9.0 9.0 -output "$APP_PATH/Comico.ios9" "$APP_PATH/Comico" && \
             mv "$APP_PATH/Comico.ios9" "$APP_PATH/Comico" && \
             chmod 755 "$APP_PATH/Comico") || true

            echo "Updated Mach-O build info:"
            vtool -show-build "$APP_PATH/Comico" || true
          fi

          # 3. Ad-hoc re-sign binary after modifying headers
          codesign --force --sign - "$APP_PATH" || true

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          mkdir -p build/ipa-prep/Payload
          cp -r "$APP_PATH" build/ipa-prep/Payload/
          cd build/ipa-prep
          zip -r ../Comico.ipa Payload
          cd ../..
          ls -lh build/Comico.ipa

      - name: Package DEB (Cydia / Sileo / Zebra / Filza for iOS 9)
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          mkdir -p deb-prep/Applications
          cp -r "$APP_PATH" deb-prep/Applications/
          mkdir -p deb-prep/DEBIAN
          cp packaging/control deb-prep/DEBIAN/control
          cp packaging/postinst deb-prep/DEBIAN/postinst
          chmod 755 deb-prep/DEBIAN/postinst
          dpkg-deb --build --root-owner-group deb-prep build/Comico.deb
          ls -lh build/Comico.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comico-iOS9-Packages
          path: |
            build/Comico.ipa
            build/Comico.deb
          retention-days: 30
