name: Build iOS IPA and DEB

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA & DEB (iOS)
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*
          # Select Xcode 14 or latest available
          if [ -d "/Applications/Xcode_14.3.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_14.3.1.app
          elif [ -d "/Applications/Xcode_15.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.0.1.app
          fi
          xcodebuild -version

      - name: Build Archive (No Code Signing Required)
        run: |
          mkdir -p build
          xcodebuild -project Comico/Comico.xcodeproj \
                     -scheme Comico \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/Comico.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .IPA
        run: |
          mkdir -p build/ipa-build/Payload
          cp -r build/Comico.xcarchive/Products/Applications/Comico.app build/ipa-build/Payload/
          cd build/ipa-build
          zip -r ../Comico.ipa Payload
          cd ../..
          ls -lh build/Comico.ipa

      - name: Package .DEB (Jailbreak Cydia / Zebra / Sileo / Filza)
        run: |
          mkdir -p deb-package/Applications
          cp -r build/Comico.xcarchive/Products/Applications/Comico.app deb-package/Applications/
          
          mkdir -p deb-package/DEBIAN
          cat << 'EOF' > deb-package/DEBIAN/control
Package: com.comico.reader
Name: Comico
Version: 1.0.0
Architecture: iphoneos-arm
Description: Comic and manga reader for iOS 9+ using MangaDex API
Maintainer: Comico Team
Author: Comico Team
Section: Applications
Depends: firmware (>= 9.0)
EOF

          cat << 'EOF' > deb-package/DEBIAN/postinst
#!/bin/sh
if which uicache >/dev/null 2>&1; then
    uicache -p /Applications/Comico.app || uicache
fi
exit 0
EOF
          chmod 755 deb-package/DEBIAN/postinst

          # Build .deb using dpkg-deb (available on macOS)
          dpkg-deb --build --root-owner-group deb-package build/Comico.deb
          ls -lh build/Comico.deb

      - name: Upload IPA & DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comico-iOS-Packages
          path: |
            build/Comico.ipa
            build/Comico.deb
          retention-days: 30

      - name: Create Release (if Tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Comico.ipa
            build/Comico.deb
          draft: false
          prerelease: false
          generate_release_notes: true


