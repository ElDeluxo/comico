name: Build Comico Universal (iOS 9.0)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal IPA & DEB (armv7 + arm64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y fakeroot libtinfo5 libtinfo6 zlib1g-dev xz-utils zip unzip || true

      - name: Setup Theos & iOS Cross Toolchain
        run: |
          echo "Cloning Theos..."
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          echo "Installing iOS Cross Toolchain (Supports armv7 & arm64)..."
          mkdir -p ~/theos/toolchain
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C ~/theos/toolchain/
          
          echo "Installing iOS SDKs (including iPhoneOS11.4.sdk)..."
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          
          echo "Installing ldid..."
          curl -sLo ~/theos/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          chmod +x ~/theos/bin/ldid
          
          echo "Setting environment variables..."
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
          echo "Verifying clang..."
          ~/theos/toolchain/linux/iphone/bin/clang --version

      - name: Setup mbedTLS 3.6 (TLS 1.3 Engine)
        run: |
          if [ ! -d "vendor/mbedtls/library" ]; then
            echo "Cloning mbedTLS v3.6.0..."
            git clone --depth 1 --branch v3.6.0 https://github.com/Mbed-TLS/mbedtls.git vendor/mbedtls
          fi
          echo "mbedTLS source ready:"
          ls -d vendor/mbedtls/include vendor/mbedtls/library

      - name: Build Comico (armv7 + arm64)
        run: |
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm || true
          set -o pipefail
          if make package FINALPACKAGE=1 2>&1 | tee build.log; then
            echo "Build successful!"
          else
            echo "Build failed. Pushing log..."
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git checkout -B build-logs
            git add -f build.log
            git commit -m "theos build log"
            git push origin build-logs --force || true
            exit 1
          fi

      - name: Verify Mach-O Architectures & Bundle
        run: |
          APP_PATH=".theos/_/Applications/Comico.app"
          echo "Inspecting binary at: $APP_PATH/Comico"
          file "$APP_PATH/Comico"
          
          if [ -x ~/theos/toolchain/linux/iphone/bin/arm64-apple-darwin-lipo ]; then
            ~/theos/toolchain/linux/iphone/bin/arm64-apple-darwin-lipo -info "$APP_PATH/Comico" || true
          fi

      - name: Package IPA
        run: |
          APP_PATH=".theos/_/Applications/Comico.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Staged app not at expected path, searching..."
            APP_PATH=$(find .theos -path "*/Applications/Comico.app" -type d | head -n 1)
          fi
          echo "Using final app bundle at: $APP_PATH"
          
          # Ensure Info.plist is present
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Copying Info.plist into app bundle..."
            cp Info.plist "$APP_PATH/Info.plist"
          fi
          
          # Ensure icons and resources are present
          cp -r Resources/* "$APP_PATH/" || true
          
          echo "App bundle contents:"
          ls -la "$APP_PATH"
          
          # Create IPA Payload
          mkdir -p ipa-build/Payload
          cp -r "$APP_PATH" ipa-build/Payload/
          cd ipa-build
          zip -r ../Comico_Universal_iOS9.ipa Payload
          cd ..
          
          echo "Verifying IPA contents for Sideloadly:"
          unzip -l Comico_Universal_iOS9.ipa | grep "Payload/Comico.app/Info.plist"
          unzip -l Comico_Universal_iOS9.ipa | grep "Payload/Comico.app/cacert.pem"
          ls -lh Comico_Universal_iOS9.ipa

      - name: Package DEB
        run: |
          APP_PATH=".theos/_/Applications/Comico.app"
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            cp Info.plist "$APP_PATH/Info.plist"
          fi
          cp -r Resources/* "$APP_PATH/" || true
          
          dpkg-deb --build --root-owner-group .theos/_ Comico_Universal_iOS9.deb
          ls -lh Comico_Universal_iOS9.deb

      - name: Package Mangie for iPad
        run: |
          python3 package_mangie.py
          ls -lh Mangie_iPad_iOS9.*

      - name: Upload Universal Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comico-iOS9-Universal
          path: |
            Comico_Universal_iOS9.ipa
            Comico_Universal_iOS9.deb
            Mangie_iPad_iOS9.ipa
            Mangie_iPad_iOS9.deb
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.4' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Comico & Mangie {0}', github.ref_name) || 'Comico & Mangie v1.3.4 (iOS 9.0+ Universal)' }}
          files: |
            Comico_Universal_iOS9.ipa
            Comico_Universal_iOS9.deb
            Mangie_iPad_iOS9.ipa
            Mangie_iPad_iOS9.deb
          body: |
            ### Comico Universal v1.3.4 & Mangie iPad Edition para iOS 9

            #### 🛠️ Corrección Crítica de Carga de Portadas y Crashes (v1.3.4):
            - **Fin a los Crashes por Concurrencia (Thread-Safety en mbedTLS):** Se implementó un mutex de bloqueo seguro (`safe_drbg_random`) sobre el generador de entropía y claves de mbedTLS 1.3. Se eliminó la condición de carrera que provocaba `EXC_BAD_ACCESS` cuando el visor cargaba múltiples portadas simultáneamente.
            - **Carga Instantánea de Portadas (Detección de Content-Length):** Se corrigió el lector de red para finalizar de inmediato al recibir el total de bytes indicados en `Content-Length`, eliminando el cuelgue por `Connection: keep-alive` de MangaDex y Archive.org.
            - **Control de Concurrencia de Red:** Máximo de 4 conexiones simultáneas mediante un semáforo (`dispatch_semaphore`), impidiendo la saturación de sockets y sobreconsumo de RAM en el iPad.
            - **Timeouts de Socket:** Límite de 10 segundos en lectura y escritura para que ninguna petición quede congelada.
            - **Descompresión en Background en `ImageCache`:** La carga y almacenamiento en disco ahora se ejecutan fuera del hilo principal, garantizando un desplazamiento suave a 60 FPS sin cierres por Watchdog.

            #### 📦 Archivos para Descargar e Instalar:
            - **`Comico_Universal_iOS9.deb`** *(Recomendado para Jailbreak)*: Instalar con Filza File Manager o Cydia. No caduca.
            - **`Comico_Universal_iOS9.ipa`**: Instalar con Sideloadly / AltStore desde PC.
