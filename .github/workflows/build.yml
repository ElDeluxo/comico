name: Build Comico Universal (iOS 9.0)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal IPA & DEB (armv7 + arm64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y fakeroot libtinfo5 libtinfo6 zlib1g-dev xz-utils zip unzip || true

      - name: Setup Theos & iOS Cross Toolchain
        run: |
          echo "Cloning Theos..."
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          echo "Installing iOS Cross Toolchain (Supports armv7 & arm64)..."
          mkdir -p ~/theos/toolchain
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C ~/theos/toolchain/
          
          echo "Installing iOS SDKs (including iPhoneOS11.4.sdk)..."
          rm -rf ~/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          
          echo "Installing ldid..."
          curl -sLo ~/theos/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          chmod +x ~/theos/bin/ldid
          
          echo "Setting environment variables..."
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
          echo "Verifying clang..."
          ~/theos/toolchain/linux/iphone/bin/clang --version

      - name: Build Comico (armv7 + arm64)
        run: |
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm || true
          set -o pipefail
          if make package FINALPACKAGE=1 2>&1 | tee build.log; then
            echo "Build successful!"
          else
            echo "Build failed. Pushing log..."
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git checkout -B build-logs
            git add -f build.log
            git commit -m "theos build log"
            git push origin build-logs --force || true
            exit 1
          fi

      - name: Verify Mach-O Architectures & Bundle
        run: |
          APP_PATH=".theos/_/Applications/Comico.app"
          echo "Inspecting binary at: $APP_PATH/Comico"
          file "$APP_PATH/Comico"
          
          if [ -x ~/theos/toolchain/linux/iphone/bin/arm64-apple-darwin-lipo ]; then
            ~/theos/toolchain/linux/iphone/bin/arm64-apple-darwin-lipo -info "$APP_PATH/Comico" || true
          fi

      - name: Package IPA
        run: |
          APP_PATH=".theos/_/Applications/Comico.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Staged app not at expected path, searching..."
            APP_PATH=$(find .theos -path "*/Applications/Comico.app" -type d | head -n 1)
          fi
          echo "Using final app bundle at: $APP_PATH"
          
          # Ensure Info.plist is present
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "Copying Info.plist into app bundle..."
            cp Info.plist "$APP_PATH/Info.plist"
          fi
          
          # Ensure icons and resources are present
          cp -r Resources/* "$APP_PATH/" || true
          
          echo "App bundle contents:"
          ls -la "$APP_PATH"
          
          # Create IPA Payload
          mkdir -p ipa-build/Payload
          cp -r "$APP_PATH" ipa-build/Payload/
          cd ipa-build
          zip -r ../Comico_Universal_iOS9.ipa Payload
          cd ..
          
          echo "Verifying IPA contents for Sideloadly:"
          unzip -l Comico_Universal_iOS9.ipa | grep "Payload/Comico.app/Info.plist"
          ls -lh Comico_Universal_iOS9.ipa

      - name: Package DEB
        run: |
          APP_PATH=".theos/_/Applications/Comico.app"
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            cp Info.plist "$APP_PATH/Info.plist"
          fi
          cp -r Resources/* "$APP_PATH/" || true
          
          dpkg-deb --build --root-owner-group .theos/_ Comico_Universal_iOS9.deb
          ls -lh Comico_Universal_iOS9.deb

      - name: Upload Universal Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comico-iOS9-Universal
          path: |
            Comico_Universal_iOS9.ipa
            Comico_Universal_iOS9.deb
          retention-days: 30
