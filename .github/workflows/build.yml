name: Build iOS IPA and DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA and DEB (iOS 9.0)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dpkg
        run: brew install dpkg

      - name: Environment Info
        run: |
          xcodebuild -version
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true

      - name: Build Comico.app
        run: |
          mkdir -p build
          set -o pipefail
          if xcodebuild -project Comico/Comico.xcodeproj \
                     -scheme Comico \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build/DerivedData \
                     build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log; then
            echo "Build succeeded!"
          else
            echo "Build failed. Uploading log to branch..."
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git checkout -b build-logs
            git add -f build.log
            git commit -m "build log"
            git push origin build-logs --force || true
            exit 1
          fi

      - name: Set iOS 9 Compatibility in Info.plist & Binary
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"

          # Force MinimumOSVersion to 9.0 in Info.plist
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 9.0" "$APP_PATH/Info.plist" || \
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 9.0" "$APP_PATH/Info.plist"

          echo "Verified Info.plist MinimumOSVersion:"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist"

          # Attempt vtool load command patch if possible
          if which vtool >/dev/null 2>&1; then
            (vtool -replace -set-build-version ios 9.0 9.0 -output "$APP_PATH/Comico.tmp" "$APP_PATH/Comico" && \
             mv "$APP_PATH/Comico.tmp" "$APP_PATH/Comico" && \
             chmod 755 "$APP_PATH/Comico") || true
          fi

          # Ad-hoc sign bundle
          codesign --force --sign - "$APP_PATH" || true

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          mkdir -p build/ipa-prep/Payload
          cp -r "$APP_PATH" build/ipa-prep/Payload/
          cd build/ipa-prep
          zip -r ../Comico.ipa Payload
          cd ../..
          ls -lh build/Comico.ipa

      - name: Package DEB
        run: |
          APP_PATH=$(find build/DerivedData -name "Comico.app" -type d | head -n 1)
          mkdir -p deb-prep/Applications
          cp -r "$APP_PATH" deb-prep/Applications/
          mkdir -p deb-prep/DEBIAN
          cp packaging/control deb-prep/DEBIAN/control
          cp packaging/postinst deb-prep/DEBIAN/postinst
          chmod 755 deb-prep/DEBIAN/postinst
          dpkg-deb --build --root-owner-group deb-prep build/Comico.deb
          ls -lh build/Comico.deb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comico-iOS9-Packages
          path: |
            build/Comico.ipa
            build/Comico.deb
          retention-days: 30
